<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  :root{
    --paper:#F4F4F2;
    --ink:#101010;
    --muted:#6B6B6B;
    --line:#D8D8D4;
    --script:"Segoe Script","Snell Roundhand","Brush Script MT","Lucida Handwriting",cursive;
    --serif:"Iowan Old Style","Palatino Linotype","Songti SC","STSong","SimSun",Georgia,serif;
    --sans:"Helvetica Neue","PingFang SC","Microsoft YaHei","Noto Sans SC",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;width:1280px;height:640px;background:var(--paper);color:var(--ink);
       font-family:var(--sans);overflow:hidden;position:relative}
  .frame{position:absolute;inset:30px;border:1px solid var(--line)}
  .top{display:flex;justify-content:space-between;align-items:baseline;padding:40px 54px 0}
  .mark{font-family:var(--script);font-size:36px;transform:rotate(-4deg);display:inline-block}
  .meta{font-size:13px;color:var(--muted);letter-spacing:.08em}
  .body{padding:58px 54px 0}
  h1{font-family:var(--serif);font-style:italic;font-weight:400;font-size:78px;line-height:1.08;
     letter-spacing:-.035em;margin:0 0 22px}
  .rule{width:58px;height:2px;background:var(--ink);margin:0 0 22px}
  p{margin:0;font-size:17px;line-height:1.7;color:var(--muted);max-width:720px}
  .foot{position:absolute;left:54px;right:54px;bottom:46px;display:flex;
        justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted);
        border-top:1px solid var(--line);padding-top:16px}
  .foot b{color:var(--ink);font-weight:500}
</style>
</head>
<body>
  <div class="frame"></div>
  <div class="top">
    <div class="mark">Sensus</div>
    <div class="meta">LLM 情绪与意图测试题库</div>
  </div>
  <div class="body">
    <h1>大模型，<br>能读懂你的<br>下一句话吗</h1>
    <div class="rule"></div>
    <p>不是问一句“你听懂了吗”。<br>是看它能不能接住你的情绪，明白你的意图。</p>
  </div>
  <div class="foot">
    <div><b>45</b> 道多轮对话 · <b>10</b> 类情绪与意图 · 只写下一句</div>
    <div>READ THE LINE / UNDER THE LINE</div>
  </div>
</body>
</html>
