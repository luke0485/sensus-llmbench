<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  :root{
    --ink:#0B0B0B; --paper:#F3F3F1; --muted:#8A8A8A; --line:#2A2A2A;
    --script:"Segoe Script","Snell Roundhand","Brush Script MT","Lucida Handwriting",cursive;
    --serif:"Iowan Old Style","Palatino Linotype","Songti SC","STSong","SimSun",Georgia,serif;
    --sans:"Helvetica Neue","PingFang SC","Microsoft YaHei","Noto Sans SC",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;width:1600px;height:900px;background:var(--ink);color:var(--paper);
       font-family:var(--sans);overflow:hidden;position:relative}
  .frame{position:absolute;inset:34px;border:1px solid var(--line)}
  .top{position:absolute;left:64px;right:64px;top:54px;display:flex;justify-content:space-between;
       align-items:baseline;font-size:14px;letter-spacing:.08em;color:var(--muted)}
  .top b{font-weight:400;color:var(--paper)}
  .body{position:absolute;left:64px;top:178px;max-width:900px}
  .kicker{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#777;margin:0 0 22px}
  h1{font-family:var(--serif);font-style:italic;font-weight:400;font-size:96px;line-height:1.02;
     letter-spacing:-.04em;margin:0 0 30px}
  .sub{font-size:20px;line-height:1.65;color:#BDBDBD;margin:0}
  .script{position:absolute;right:80px;bottom:86px;font-family:var(--script);font-size:210px;
          line-height:.75;transform:rotate(-8deg);color:var(--paper);letter-spacing:-.04em}
  .foot{position:absolute;left:64px;right:64px;bottom:48px;display:flex;justify-content:space-between;
        align-items:baseline;font-size:13px;color:#777;border-top:1px solid var(--line);padding-top:16px}
  .foot b{font-weight:400;color:var(--paper)}
</style>
</head>
<body>
  <div class="frame"></div>
  <div class="top">
    <div><b>SENSUS</b> · LLM 情绪与意图测试题库</div>
    <div>A BENCHMARK FOR LLM DIALOGUE</div>
  </div>
  <div class="body">
    <p class="kicker">Read the line under the line</p>
    <h1>大模型，<br>能读懂你的<br>下一句话吗</h1>
    <p class="sub">不是问一句“你听懂了吗”。<br>是看它能不能接住你的情绪，明白你的意图。</p>
  </div>
  <div class="script">Sensus</div>
  <div class="foot">
    <div><b>45</b> 道多轮对话 · <b>10</b> 类情绪与意图 · 只写下一句</div>
    <div>代码 MIT · 题目 CC BY 4.0</div>
  </div>
</body>
</html>
